<!doctype html>
<html>
  <head>
    <title>Product Enquiry</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
      }
      .box {
        max-width: 850px;
        margin: 70px auto;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 50px #0001;
        display: grid;
        grid-template-columns: 35% 65%;
        overflow: hidden;
      }
      .info {
        background: #2563eb;
        color: white;
        padding: 45px 30px;
      }
      .info h1 {
        font-size: 32px;
      }
      .info p {
        line-height: 1.7;
        color: #dbeafe;
      }
      .info div {
        margin-top: 30px;
      }
      .form {
        padding: 40px;
      }
      .form h2 {
        margin-top: 0;
        font-size: 28px;
      }
      .row {
        display: flex;
        gap: 15px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 13px;
        margin: 7px 0 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: 0;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #2563eb;
      }
      textarea {
        height: 110px;
        resize: none;
      }
      button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      @media (max-width: 700px) {
        .box {
          display: block;
          margin: 25px 15px;
        }
        .row {
          display: block;
        }
        .info,
        .form {
          padding: 30px;
        }
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="info">
        <h1>Let's Talk 👋</h1>
        <p>
          Interested in our products? Send us your requirements and our team
          will get back to you shortly.
        </p>

        <div>📧 sales@example.com</div>
        <div>📞 +91 98765 43210</div>
        <div>📍 New Delhi, India</div>
      </div>

      <div class="form">
        <h2>Product Enquiry</h2>
        <p>Fill in the details below.</p>

        <form>
          <div class="row">
            <input placeholder="Full Name *" required />
            <input type="email" placeholder="Email *" required />
          </div>

          <div class="row">
            <input placeholder="Phone Number" />
            <input placeholder="Company Name" />
          </div>

          <div class="row">
            <select required>
              <option value="">Select Product *</option>
              <option>Product 1</option>
              <option>Product 2</option>
              <option>Product 3</option>
            </select>
            <input type="number" placeholder="Quantity" />
          </div>

          <textarea placeholder="Tell us about your requirements..."></textarea>

          <button>Send Enquiry →</button>
        </form>
      </div>
    </div>
  </body>
</html>
